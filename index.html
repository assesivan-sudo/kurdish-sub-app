<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وەرگێڕانی ڤیدیۆ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ئەمە کتێبخانەی Supabase یە کە زیادمان کردووە -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700&family=Noto+Kufi+Arabic:wght@700&family=Noto+Sans+Arabic:wght@700&family=Tajawal:wght@700&display=swap');
        
        @font-face {
            font-family: 'NRT';
            src: url('nrt.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Rudaw';
            src: url('rudaw.ttf') format('truetype');
        }
        @font-face {
            font-family: 'Speda';
            src: url('Speda.ttf') format('truetype');
        }

        body {
            font-family: 'Noto Kufi Arabic', sans-serif;
            background-color: #0f0f0f;
        }
        .kurdish-subtitle {
            font-weight: bold;
            text-shadow: 
                2px 2px 0 #000, 
                -1px -1px 0 #000,  
                1px -1px 0 #000, 
                -1px 1px 0 #000, 
                1px 1px 0 #000;
            transition: all 0.2s ease-in-out;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center pt-16 pb-10">

    <div class="w-full max-w-md px-5 mb-8">
        <div class="text-right">
            <p class="text-gray-400 text-sm mb-1">بەیانیت باش</p>
            <h1 class="text-2xl font-bold tracking-wide">Sivan</h1>
        </div>
    </div>

    <div class="w-full max-w-md px-5">
        <div class="bg-[#1c1c1e] rounded-3xl p-6 border border-gray-800 shadow-lg">
            <p class="text-right text-gray-300 mb-4 text-sm font-medium">لینکێکی یووتیووب دابنێ</p>
            
            <div class="relative mb-5">
                <input type="text" id="youtube-link" placeholder="https://youtube.com/watch?v=..." 
                       class="w-full bg-[#121212] border border-gray-700 rounded-2xl px-4 py-3.5 text-left text-gray-300 focus:outline-none focus:border-[#83d1c4] transition-colors" dir="ltr">
            </div>

            <div class="flex gap-3">
                <button class="bg-[#242424] border border-gray-700 hover:bg-gray-700 transition-colors rounded-2xl p-3.5 flex justify-center items-center w-14">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                </button>
                <button id="translate-btn" class="flex-1 bg-[#83d1c4] hover:bg-[#6ebcae] text-black font-bold rounded-2xl py-3.5 text-lg transition-colors shadow-[0_0_15px_rgba(131,209,196,0.3)]">
                    وەرگێڕان
                </button>
            </div>
        </div>
    </div>

    <div id="video-container" class="w-full flex flex-col items-center mt-6"></div>

    <div id="settings-panel" class="w-full max-w-md px-5 mt-4 hidden">
        <div class="bg-[#1c1c1e] rounded-3xl p-6 border border-gray-800 shadow-lg">
            <h3 class="text-right text-[#83d1c4] mb-5 text-sm font-bold flex items-center justify-end gap-2">
                ڕێکخستنی شێوازی ژێرنووس
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </h3>
            
            <div class="flex flex-col gap-5">
                <div>
                    <label class="text-xs text-gray-400 block mb-2 text-right">جۆری فۆنت</label>
                    <select id="font-family-input" class="w-full bg-[#121212] border border-gray-700 rounded-lg px-3 py-2.5 text-right text-gray-300 focus:outline-none focus:border-[#83d1c4] cursor-pointer" dir="rtl">
                        <option value="'NRT', sans-serif">ئێن ئاڕ تی (NRT)</option>
                        <option value="'Rudaw', sans-serif">ڕووداو (Rudaw)</option>
                        <option value="'Speda', sans-serif">سپێدە (Speda)</option>
                        <option value="'Noto Kufi Arabic', sans-serif">نۆتۆ کوفی (Noto Kufi)</option>
                        <option value="'Cairo', sans-serif">قاهیرە (Cairo)</option>
                        <option value="'Tajawal', sans-serif">تەجەوال (Tajawal)</option>
                        <option value="'Noto Sans Arabic', sans-serif">نۆتۆ سانس (Noto Sans)</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-2 text-right">قەبارەی دەق</label>
                    <input type="range" id="font-size-input" min="14" max="40" value="22" class="w-full accent-[#83d1c4]">
                </div>
                
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs text-gray-400 block mb-2 text-right">باگراوند</label>
                        <input type="color" id="bg-color-input" value="#000000" class="w-full h-10 rounded cursor-pointer border-0 bg-transparent">
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-gray-400 block mb-2 text-right">ڕەنگی دەق</label>
                        <input type="color" id="text-color-input" value="#ffffff" class="w-full h-10 rounded cursor-pointer border-0 bg-transparent">
                    </div>
                </div>

                <div>
                    <label class="text-xs text-gray-400 block mb-2 text-right">تۆخی باگراوند (Opacity)</label>
                    <input type="range" id="bg-opacity-input" min="0" max="100" value="75" class="w-full accent-[#83d1c4]">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
